name: action
# Runs the action of this repository on a pull request, with the code of the pull request, so a
# change to action.yml is tested before it is released.
on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action.yml
      - testdata/**
      - internal/**
      - cmd/**
permissions:
  contents: read
  pull-requests: write
jobs:
  dogfood:
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token and cannot comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/bin/graviton-readiness" ./cmd/graviton-readiness && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: scan
        uses: ./
        with:
          version: local
          path: testdata
          comment: "true"
          comment-plan: "true"
      - name: The outputs are filled
        env:
          NOT_READY: ${{ steps.scan.outputs.not-ready }}
          UNVERIFIED: ${{ steps.scan.outputs.unverified }}
          READY: ${{ steps.scan.outputs.ready }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          test "$NOT_READY" = "2" && test "$UNVERIFIED" = "3" && test "$READY" = "0"
          test -s "$SARIF" && jq -e '.version == "2.1.0"' "$SARIF" >/dev/null
          echo "not ready $NOT_READY, unverified $UNVERIFIED, ready $READY"
      - name: fail-on is applied after the comment
        id: failon
        uses: ./
        continue-on-error: true
        with:
          version: local
          path: testdata
          fail-on: not-ready
      - name: The job failed on purpose
        env:
          OUTCOME: ${{ steps.failon.outcome }}
        run: test "$OUTCOME" = "failure"
