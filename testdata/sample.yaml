# A small, made-up namespace: one Graviton-ready service, one pinned to amd64,
# one with an amd64-only image, and an agent that runs on every node.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:1.27
          resources: {requests: {cpu: 500m}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: api
          image: registry.example.com/shop/api:2.3
          resources: {requests: {cpu: "1"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: shop}
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: worker
          image: registry.example.com/shop/worker:1.9-amd64
          args: ["fetch https://tools.example.com/cli_linux_amd64"]
          resources: {requests: {cpu: 250m}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: log-agent, namespace: kube-system}
spec:
  template:
    spec:
      containers:
        - name: agent
          image: registry.example.com/platform/log-agent:4.1
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report, namespace: shop}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: registry.example.com/shop/report:7
